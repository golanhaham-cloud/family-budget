<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>תקציב המשפחה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F6F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תקציב המשפחה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; }
  /* --- תחושת לחיצה טבעית: תגובה עדינה ומיידית לכל כפתור --- */
  button, [role="button"] {
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.09s ease-out, opacity 0.09s ease-out;
  }
  button:active { transform: scale(0.95); opacity: 0.85; }
  [role="button"]:active { opacity: 0.6; }
  button:disabled:active { transform: none; opacity: 0.5; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Assistant', sans-serif; background: #F3F6F4; -webkit-tap-highlight-color: transparent; }
  input, select { font-family: 'Assistant', sans-serif; }
  #root { min-height: 100vh; }
  /* --- הוצאות קבועות: כרטיס לכל שורה (תצוגה בלבד) --- */
  .fx-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 10px; padding: 12px 14px; min-width: 0; align-items: start; }
  .fx-main { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .fx-text { flex: 1 1 0; min-width: 0; }
  .fx-name { display: block; width: 100%; border: none; background: none; padding: 0; margin: 0; font: inherit; font-size: 15px; font-weight: 700; line-height: 1.35; resize: none; overflow: hidden; overflow-wrap: anywhere; white-space: pre-wrap; color: inherit; }
  .fx-name:focus { outline: 2px solid #E4F0EC; border-radius: 6px; }
  .fx-sub { font-size: 12px; line-height: 1.4; color: #6B7A75; margin-top: 2px; overflow-wrap: anywhere; }
  .fx-controls { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; min-width: 0; }
  .fx-ctl { height: 40px; border-radius: 10px; border: 1px solid #E1E8E4; background: #fff; font-size: 16px; font-family: inherit; color: inherit; min-width: 0; width: 100%; }
  .fx-amount { display: flex; align-items: center; gap: 2px; padding: 0 6px; }
  .fx-amount input { border: none; background: none; width: 100%; min-width: 0; font-size: 16px; font-family: inherit; text-align: center; padding: 0; height: 100%; outline: none; }
  .fx-amount span { font-size: 13px; color: #6B7A75; }
  .fx-freq { padding: 0 4px; font-size: 15px; }
  .fx-credit { padding: 0 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .fx-compact { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 14px; border: none; background: none; font: inherit; color: inherit; text-align: right; cursor: pointer; }
  .fx-day { width: 28px; height: 28px; border-radius: 8px; background: #E4F0EC; color: #2F6F5E; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0; }
  .fx-cname { flex: 1 1 0; min-width: 0; font-size: 14.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .fx-cname small { font-weight: 500; font-size: 11.5px; color: #6B7A75; }
  .fx-camt { font-size: 14.5px; font-weight: 700; white-space: nowrap; }
  .fx-chev { color: #6B7A75; font-size: 12px; }
  .fx-panel { order: 5; }
  .fx-del { width: 44px; height: 44px; border-radius: 10px; border: none; background: #F3F6F4; color: #E4572E; font-size: 16px; cursor: pointer; }
  @media (min-width: 640px) {
    .fx-card { grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px; }
    .fx-controls { grid-column: auto; grid-template-columns: repeat(3, 130px); }
    .fx-del { order: 2; width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
